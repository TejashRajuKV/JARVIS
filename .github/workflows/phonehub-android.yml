name: Phone Hub Android build

on:
  push:
    paths:
      - "android/phonehub/**"
      - ".github/workflows/phonehub-android.yml"
  pull_request:
    paths:
      - "android/phonehub/**"
      - ".github/workflows/phonehub-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phonehub-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platform-tools
            platforms;android-35
            build-tools;35.0.0

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android/phonehub
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-phonehub-debug
          path: android/phonehub/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
