# Runs the JARVIS test suite on every push and pull request.
name: tests

on:
  push:
  pull_request:

jobs:
  test:
    # Bound a stuck test runner so a hung suite cannot occupy a runner for hours.
    timeout-minutes: 20
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        # package.json and unpdf require Node >=22; test supported LTS/current majors only.
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Run test suite
        run: npm test
        timeout-minutes: 15
